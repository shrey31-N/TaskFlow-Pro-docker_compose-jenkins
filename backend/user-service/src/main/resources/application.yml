server:
  port: 8081

spring:
  application:
    name: user-service

  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taskflow_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  secret: ${JWT_SECRET:MySuperSecretKeyForTaskFlowApplication123456789}
  expiration: ${JWT_EXPIRATION:3600000}

admin:
  secret-key: ${ADMIN_SECRET_KEY:TaskFlowAdmin2026Secret}

aws:
  region: ${AWS_REGION:ap-south-1}
  s3:
    bucket-name: ${AWS_S3_BUCKET:taskflow-pro-profile-images}
    # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY must be provided via environment
    # variables in real deployments. No credential values are embedded here.
    # When unset, the application falls back to the AWS SDK default credentials
    # provider chain (e.g. an EC2/ECS instance role).
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
