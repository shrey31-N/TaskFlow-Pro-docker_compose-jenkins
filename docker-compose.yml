services:

    mysql:
        image: mysql:8.0

        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
            MYSQL_DATABASE: ${DB_NAME:-taskflow_db}
            MYSQL_USER: ${DB_USERNAME:-taskflow}
            MYSQL_PASSWORD: ${DB_PASSWORD:-taskflow123}
        ports:
            - "3307:3306"

        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
            interval: 10s
            timeout: 5s
            retries: 10

        volumes:
            - mysql-data:/var/lib/mysql

        networks:
            - taskflow-network

    discovery-server:
        build: ./backend/discovery-server
        ports:
            - "8761:8761"

        healthcheck:
            test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - taskflow-network


    api-gateway:
        build: ./backend/api-gateway
        ports:
            - "8080:8080"
        environment:
            EUREKA_URL: http://discovery-server:8761/eureka/
            JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}

        depends_on:
            discovery-server:
                condition: service_started
            user-service:
                condition: service_started
            project-service:
                condition: service_started
            task-service:
                condition: service_started
            notification-service:
                condition: service_started
        networks:
            - taskflow-network

    user-service:
        build: ./backend/user-service
        ports:
            - "8081:8081"
        environment:
            DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-taskflow_db}
            DB_USERNAME: ${DB_USERNAME:-taskflow}
            DB_PASSWORD: ${DB_PASSWORD:-taskflow123}
            EUREKA_URL: http://discovery-server:8761/eureka/
            JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}

        depends_on:
            discovery-server:
                condition: service_started
            mysql:
                condition: service_healthy

        networks:
            - taskflow-network

    project-service:
        build: ./backend/project-service
        ports:
            - "8082:8082"
        environment:
            DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-taskflow_db}
            DB_USERNAME: ${DB_USERNAME:-taskflow}
            DB_PASSWORD: ${DB_PASSWORD:-taskflow123}
            EUREKA_URL: http://discovery-server:8761/eureka/
        depends_on:
            discovery-server:
                condition: service_started
            mysql:
                condition: service_healthy
        
        networks:
            - taskflow-network

    task-service:
        build: ./backend/task-service
        ports:
            - "8083:8083"

        environment:
            DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-taskflow_db}
            DB_USERNAME: ${DB_USERNAME:-taskflow}
            DB_PASSWORD: ${DB_PASSWORD:-taskflow123}
            EUREKA_URL: http://discovery-server:8761/eureka/

        depends_on:
            discovery-server:
                condition: service_started
            mysql:
                condition: service_healthy
        
        networks:
            - taskflow-network


    notification-service:
        build: ./backend/notification-service
        ports:
            - "8084:8084"

        environment:
            DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-taskflow_db}
            DB_USERNAME: ${DB_USERNAME:-taskflow}
            DB_PASSWORD: ${DB_PASSWORD:-taskflow123}
            EUREKA_URL: http://discovery-server:8761/eureka/

        depends_on:
            discovery-server:
                condition: service_started
            mysql:
                condition: service_healthy

        networks:
            - taskflow-network

    frontend:
        build: ./frontend
        depends_on:
            api-gateway:
                condition: service_started
        ports:
            - "3000:80"
        networks:
            - taskflow-network

        
networks:
    taskflow-network:
        driver: bridge

volumes:
    mysql-data:
